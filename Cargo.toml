# Copyright 2018-2026 the Deno authors. MIT license.
# Standalone copy of ext/io from denoland/deno v2.9.7, with the workspace
# dependency versions pinned explicitly and rand bumped to 0.8.6.
# See NOTICE.md.

[package]
name = "deno_io"
version = "0.169.0"
authors = ["the Deno authors"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/frontal-labs/deno_io"
description = "IO primitives for Deno extensions (Frontal Labs fork)"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.73"
deno_core = "0.412.0"
deno_error = "=0.7.1"
deno_permissions = "0.118.0"
filetime = "0.2.16"
log = { version = "0.4.28", features = ["kv"] }
pin-project = "1.0.11"
tokio = { version = "1.47.1", features = ["full"] }
uuid = { version = "1.3.0", features = ["v4"] }

[target.'cfg(not(windows))'.dependencies]
os_pipe = { version = "=1.2.1", features = ["io_safety"] }
libc = "0.2.168"

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", features = ["fs", "user", "socket"] }

[target.'cfg(windows)'.dependencies]
rand = "=0.8.6"
parking_lot = "0.12.0"
windows-sys = { version = "0.59.0", features = ["Win32_System_Console"] }
deno_subprocess_windows = "0.54.0"
libc = "0.2.168"
